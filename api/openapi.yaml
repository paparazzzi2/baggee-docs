openapi: 3.1.0
info:
  title: Baggee API
  version: snapshot-2026-10
  description: 'REST API маркетплейса Baggee (P2P: покупатели ↔ путешественники с товарами из-за рубежа).

    Спецификация сгенерирована из кода FastAPI-приложения и очищена: убраны HTML-страницы интерфейса и
    тестовые mock-эндпоинты оплаты. Ограничения по ролям (user / moderator / admin) проверяются на сервере,
    см. docs/01-roles-and-permissions.md.


    REST API of Baggee, a P2P marketplace. Generated from the FastAPI code, cleaned of UI page routes
    and mock payment stubs.'
paths:
  /auth/register:
    post:
      summary: Register
      operationId: register_auth_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Auth
  /auth/login:
    post:
      summary: Login
      operationId: login_auth_login_post
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_login_auth_login_post'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Auth
  /auth/me:
    get:
      summary: Me
      operationId: me_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - OAuth2PasswordBearer: []
      tags:
      - Auth
  /auth/user/{username}:
    get:
      summary: Public Profile
      operationId: public_profile_auth_user__username__get
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
          title: Username
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Auth
  /auth/forgot-password:
    post:
      summary: Forgot Password
      description: Всегда отвечает одинаково — нельзя узнать, зарегистрирован ли email.
      operationId: forgot_password_auth_forgot_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Auth
  /auth/reset-password:
    post:
      summary: Reset Password
      operationId: reset_password_auth_reset_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Auth
  /auth/send-confirmation:
    post:
      summary: Send Confirmation
      description: Повторная отправка письма подтверждения (кнопка в настройках).
      operationId: send_confirmation_auth_send_confirmation_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - OAuth2PasswordBearer: []
      tags:
      - Auth
  /auth/confirm-email:
    get:
      summary: Confirm Email
      description: Переход по ссылке из письма. Редиректит на страницу результата.
      operationId: confirm_email_auth_confirm_email_get
      parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
          title: Token
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Auth
  /auth/change-password:
    post:
      summary: Change Password
      operationId: change_password_auth_change_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
      tags:
      - Auth
  /auth/change-username:
    post:
      summary: Change Username
      description: 'Смена ника. username — ссылка во многих таблицах (лоты, сделки, чаты,

        выводы), поэтому обновляем всё одной транзакцией и выдаём новый токен

        (в JWT sub = username, старый токен станет недействительным).'
      operationId: change_username_auth_change_username_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeUsernameRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
      tags:
      - Auth
  /auth/change-email:
    post:
      summary: Change Email
      description: 'Смена почты: подтверждение сбрасывается, на новый адрес уходит письмо

        со ссылкой. Старый адрес получает уведомление (защита от угона).'
      operationId: change_email_auth_change_email_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeEmailRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
      tags:
      - Auth
  /lots/pending:
    get:
      summary: List Pending Lots
      operationId: list_pending_lots_lots_pending_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LotResponse'
                type: array
                title: Response List Pending Lots Lots Pending Get
      security:
      - OAuth2PasswordBearer: []
      tags:
      - Lot moderation
  /lots/owner-stats/{username}:
    get:
      summary: Owner Stats
      description: 'Досье продавца для модерации: ID аккаунта, стаж и история лотов.

        Помогает модератору сразу узнать проверенного автора и быстрее принять решение.'
      operationId: owner_stats_lots_owner_stats__username__get
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: username
        in: path
        required: true
        schema:
          type: string
          title: Username
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Lot moderation
  /lots/pending/{lot_id}/approve:
    put:
      summary: Approve Lot
      operationId: approve_lot_lots_pending__lot_id__approve_put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: lot_id
        in: path
        required: true
        schema:
          type: integer
          title: Lot Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Lot moderation
  /lots/pending/{lot_id}/reject:
    put:
      summary: Reject Lot
      operationId: reject_lot_lots_pending__lot_id__reject_put
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: lot_id
        in: path
        required: true
        schema:
          type: integer
          title: Lot Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Lot moderation
  /lots:
    post:
      summary: Create Lot
      operationId: create_lot_lots_post
      security:
      - OAuth2PasswordBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LotCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Lots
    get:
      summary: List Lots
      operationId: list_lots_lots_get
      parameters:
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
      - name: country_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Country From
      - name: country_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Country To
      - name: city_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: City From
      - name: city_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: City To
      - name: date_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date From
      - name: date_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date
          - type: 'null'
          title: Date To
      - name: min_weight
        in: query
        required: false
        schema:
          anyOf:
          - type: number
            minimum: 0
          - type: 'null'
          title: Min Weight
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 64
          - type: 'null'
          title: Q
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: new
          title: Sort
      - name: owner
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Owner
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 200
          default: 50
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LotResponse'
                title: Response List Lots Lots Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Lots
  /lots/my:
    get:
      summary: Get My Lots
      description: All lots belonging to the current user, any status.
      operationId: get_my_lots_lots_my_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/LotResponse'
                type: array
                title: Response Get My Lots Lots My Get
      security:
      - OAuth2PasswordBearer: []
      tags:
      - Lots
  /lots/{lot_id}:
    patch:
      summary: Update Lot
      operationId: update_lot_lots__lot_id__patch
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: lot_id
        in: path
        required: true
        schema:
          type: integer
          title: Lot Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LotUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Lots
    get:
      summary: Get Lot
      operationId: get_lot_lots__lot_id__get
      parameters:
      - name: lot_id
        in: path
        required: true
        schema:
          type: integer
          title: Lot Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Lots
    delete:
      summary: Delete Lot
      operationId: delete_lot_lots__lot_id__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: lot_id
        in: path
        required: true
        schema:
          type: integer
          title: Lot Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Lots
  /lots/map-data:
    get:
      summary: Get Map Data
      description: 'Public endpoint: active + pending lots for 2D map display.'
      operationId: get_map_data_lots_map_data_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      tags:
      - Lots
  /lots/{lot_id}/tickets:
    post:
      summary: Upload Lot Tickets
      description: 'Загрузка билетов владельцем лота. До 5 файлов. Каждый — JPEG/PNG/WebP/GIF/PDF до 15
        МБ.

        После загрузки лот переходит в pending (если был active) — требуется повторная модерация.'
      operationId: upload_lot_tickets_lots__lot_id__tickets_post
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: lot_id
        in: path
        required: true
        schema:
          type: integer
          title: Lot Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_lot_tickets_lots__lot_id__tickets_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Lots
  /lots/{lot_id}/tickets/{filename}:
    delete:
      summary: Delete Lot Ticket
      operationId: delete_lot_ticket_lots__lot_id__tickets__filename__delete
      security:
      - OAuth2PasswordBearer: []
      parameters:
      - name: lot_id
        in: path
        required: true
        schema:
          type: integer
          title: Lot Id
      - name: filename
        in: path
        required: true
        schema:
          type: string
          title: Filename
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LotResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Lots
  /admin/users:
    get:
