  /auth/cover:
    post:
      summary: Upload Cover
      description: 'Фон (обложка) шапки профиля. Требования: JPG/PNG/WEBP/GIF, до 10 МБ.

        Рекомендуемый размер ~1500×400 — картинка растягивается по ширине шапки.'
      operationId: upload_cover_auth_cover_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_cover_auth_cover_post'
        required: true
      responses:
        '200':
