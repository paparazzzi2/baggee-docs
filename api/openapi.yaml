          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - OAuth2PasswordBearer: []
      tags:
      - Auth
    delete:
      summary: Delete Cover
      description: Убрать обложку — вернётся стандартный градиент.
      operationId: delete_cover_auth_cover_delete
      responses:
        '204':
          description: Successful Response
      security:
      - OAuth2PasswordBearer: []
      tags:
